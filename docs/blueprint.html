<title>Devil's Den Blueprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: three-pane "lesson" — parts list · isometric stage with stepper · step notes. Paper, ink outlines, hard offset shadows. */
:root {
  --paper: #f4ebe0; --sheet: #f9f2e8; --card: #f8f0e6; --line: #ddd3c5; --line-strong: #c6bbac;
  --ink: #1d1b18; --ink-2: #34302b; --muted: #6f6961; --drop: #1d1b18;
  --green: #cfe3b2; --green-2: #7fc278; --violet: #e7ddf5; --orange: #fcdcbd; --blue: #c4dcf3;
  --yellow: #f6df97; --rose: #f6cad0; --stone: #e6dccd; --red: #d0563a;
  --grid: rgba(70, 65, 59, .10); --glow: #6cb85f; --char-ink: #1d1b18;
  --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #181613; --sheet: #211e1a; --card: #1f1c18; --line: #39342d; --line-strong: #4b453d;
    --ink: #efe6d9; --ink-2: #d9cfc1; --muted: #a2998c; --drop: #000;
    --green: #4f6b3b; --green-2: #8fcf7f; --violet: #574a70; --orange: #7f5333; --blue: #37536f;
    --yellow: #7a6628; --rose: #74404a; --stone: #4a433a; --red: #e0714f;
    --grid: rgba(239, 230, 217, .07); --glow: #8fcf7f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #181613; --sheet: #211e1a; --card: #1f1c18; --line: #39342d; --line-strong: #4b453d;
  --ink: #efe6d9; --ink-2: #d9cfc1; --muted: #a2998c; --drop: #000;
  --green: #4f6b3b; --green-2: #8fcf7f; --violet: #574a70; --orange: #7f5333; --blue: #37536f;
  --yellow: #7a6628; --rose: #74404a; --stone: #4a433a; --red: #e0714f;
  --grid: rgba(239, 230, 217, .07); --glow: #8fcf7f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.55; }
button { font-family: inherit; color: inherit; }
code { font-family: var(--font); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: .92em; }
:focus-visible { outline: 2px solid var(--green-2); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 14px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.brand mark { background: var(--green); color: var(--ink); padding: 0 4px; border-radius: 3px; }
.chip { font-size: 11px; font-weight: 600; border: 1.2px solid var(--ink); border-radius: 999px; padding: 2px 10px; background: var(--violet); box-shadow: 1px 1.5px 0 var(--drop); white-space: nowrap; }
.spacer { flex: 1; }
.iconbtn { border: 1.2px solid var(--line-strong); background: var(--sheet); border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; }
.iconbtn:hover { border-color: var(--ink); }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 14px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); align-items: start; }

/* parts list */
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav h2 { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin: 4px 6px 8px; }
.nav h2 small { color: var(--muted); font-weight: 500; font-size: 11px; }
.part { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1.2px solid transparent; background: none; cursor: pointer; text-align: left; font-size: 13px; font-weight: 500; width: 100%; }
.part:hover { background: var(--sheet); border-color: var(--line); }
.part[aria-current="true"] { background: var(--green); border-color: var(--ink); box-shadow: 1.5px 2.5px 0 var(--drop); font-weight: 700; }
.part .n { color: var(--muted); font-size: 11px; margin-left: auto; font-variant-numeric: tabular-nums; }
.part[aria-current="true"] .n { color: var(--ink-2); }
.folder { width: 18px; height: 14px; border-radius: 2px 3px 3px 3px; border: 1.2px solid var(--ink); position: relative; flex: none; }
.folder::before { content: ""; position: absolute; left: -1.2px; top: -5px; width: 8px; height: 4px; border: 1.2px solid var(--ink); border-bottom: 0; border-radius: 2px 2px 0 0; background: inherit; }
.navnote { margin: 14px 6px 0; padding: 12px; border: 1px dashed var(--line-strong); border-radius: 10px; color: var(--muted); font-size: 11.5px; }

/* stage */
.main { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.crumbs { color: var(--muted); font-size: 12px; }
.headrow { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; }
.headrow h1 { font-size: clamp(22px, 3vw, 30px); line-height: 1.15; margin: 4px 0 4px; letter-spacing: -.02em; text-wrap: balance; }
.headrow p { margin: 0; color: var(--muted); max-width: 62ch; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tags .chip:nth-child(1) { background: var(--orange); }
.tags .chip:nth-child(2) { background: var(--green); }
.stagewrap { border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); overflow: hidden; position: relative; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
.stat { border: 1px solid var(--line-strong); background: var(--card); border-radius: 8px; padding: 6px 10px; min-width: 100px; }
.stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
svg.stage { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 12px 10px; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.2px solid var(--ink); margin-right: 5px; vertical-align: -1px; }

.stepper { border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); padding: 10px 12px 12px; }
.stepper header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.stepper header span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
.dots { display: flex; overflow-x: auto; padding-bottom: 4px; }
.dot { flex: 1 0 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; position: relative; padding: 2px 0; font-size: 10.5px; color: var(--muted); }
.dot::before { content: ""; position: absolute; top: 15px; left: -50%; right: 50%; height: 2px; background: var(--line-strong); z-index: 0; }
.dot:first-child::before { display: none; }
.dot.done::before, .dot.cur::before { background: var(--ink); }
.dot b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.2px solid var(--ink-2); background: var(--sheet); font-size: 11px; position: relative; z-index: 1; color: var(--ink); }
.dot.done b { background: var(--green); }
.dot.cur b { background: var(--green); box-shadow: 0 0 0 4px color-mix(in oklab, var(--green-2) 40%, transparent); font-weight: 800; }
.dot.cur { color: var(--ink); font-weight: 700; }

/* notes */
.side { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.stephead { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.tag { font-size: 10px; letter-spacing: .08em; font-weight: 700; border: 1.2px solid var(--ink); border-radius: 999px; padding: 2px 9px; }
.tag.CONCEPT { background: var(--violet); } .tag.PROBLEM { background: var(--rose); } .tag.TECHNIQUE { background: var(--blue); }
.tag.TRADE-OFF { background: var(--orange); } .tag.DECISION { background: var(--yellow); } .tag.RECAP { background: var(--green); }
.panel h3 { font-size: 17px; line-height: 1.3; margin: 10px 0 8px; text-wrap: balance; }
.body p { margin: 0 0 10px; color: var(--ink-2); }
.body ul { margin: 0 0 10px; padding-left: 18px; color: var(--ink-2); }
.body li { margin-bottom: 4px; }
.key { background: var(--violet); border: 1px solid color-mix(in oklab, var(--ink) 25%, transparent); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; margin-top: 4px; }
.key small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--ink-2); }
.key .ki { width: 24px; height: 24px; border: 1.2px solid var(--ink); border-radius: 6px; background: var(--sheet); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.navbtns { display: flex; gap: 8px; margin-top: 16px; }
.btn { border: 1.2px solid var(--ink); border-radius: 8px; background: var(--sheet); padding: 8px 12px; font-weight: 600; font-size: 12.5px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 1.5px 2.5px 0 var(--drop); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.primary { background: var(--green); flex: 1; justify-content: space-between; }
.btn:active { transform: translate(1px, 1.5px); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.hint { text-align: center; color: var(--muted); font-size: 10.5px; margin-top: 8px; }
kbd { font-family: var(--font); font-size: 10px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; background: var(--sheet); }
.decide h4 { font-size: 11px; letter-spacing: .08em; margin: 0 0 10px; }
.decide label { display: flex; gap: 9px; align-items: flex-start; font-size: 12px; color: var(--ink-2); padding: 4px 0; cursor: pointer; }
.decide input { accent-color: var(--green-2); margin-top: 3px; }

/* svg pieces */
.edge { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
.seam { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; opacity: .85; }
.f-top { fill: color-mix(in oklab, var(--h) 62%, #fff); }
.f-left { fill: var(--h); }
.f-right { fill: color-mix(in oklab, var(--h) 82%, #000); }
.lbl { fill: var(--ink); font-family: var(--font); font-weight: 800; text-anchor: middle; }
.sub { fill: var(--ink-2); font-family: var(--font); font-weight: 500; text-anchor: middle; }
.pbody { fill: var(--sheet); stroke: var(--ink); stroke-width: 2; }
.pdrop { fill: var(--drop); }
.ptext { fill: var(--ink); font-family: var(--font); font-weight: 700; text-anchor: middle; }
.arrow { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.arrow.dashed { stroke-dasharray: 6 6; opacity: .7; }
.arrow.bad { stroke: var(--red); }
.lead { stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 3 4; fill: none; }
.vision { fill: color-mix(in oklab, var(--green-2) 22%, transparent); stroke: var(--glow); stroke-width: 2; stroke-dasharray: 7 6; }
.vision.devil { fill: color-mix(in oklab, var(--red) 16%, transparent); stroke: var(--red); }
.pk-req { fill: #ef9a52; stroke: var(--ink); stroke-width: 1.5; }
.pk-res { fill: #7fc278; stroke: var(--ink); stroke-width: 1.5; }
.ico { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.stage.spinning { cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.stage.spinning:active { cursor: grabbing; }
[data-spin]:focus-visible .pbody { stroke: var(--green-2); stroke-width: 3; }
.small .edge { stroke-width: 1.7; }
.small .seam { stroke-width: 1; }
.phasehdr { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 12px 6px 2px; text-transform: uppercase; }
.phasehdr:first-child { margin-top: 0; }
.chr * { stroke: var(--char-ink); stroke-width: 2.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.chr .shadow { stroke: none; fill: rgba(0,0,0,.16); }
.el { transition: opacity .35s ease; }
.el.dim { opacity: .18; }
.el.hi { filter: drop-shadow(0 0 1px var(--glow)) drop-shadow(0 0 9px var(--glow)); }
.el.enter { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.94); } to { opacity: 1; transform: none; } }
.walk { animation: bob .5s ease-in-out infinite alternate; }
.walk .l1 { animation: step .5s ease-in-out infinite alternate; }
.walk .l2 { animation: step .5s ease-in-out infinite alternate-reverse; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-3px); } }
.float { animation: float 2.2s ease-in-out infinite alternate; }
@keyframes float { from { transform: translateY(0); } to { transform: translateY(-7px); } }
@media (prefers-reduced-motion: reduce) {
  .el.enter, .walk, .walk .l1, .walk .l2, .float { animation: none; }
}

@media (max-width: 1180px) {
  .app { grid-template-columns: 210px minmax(0, 1fr); }
  .side { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
  .nav h2, .navnote, .phasehdr { display: none; }
  .part { width: auto; white-space: nowrap; flex: none; }
  .part .n { display: none; }
  .side { grid-template-columns: minmax(0, 1fr); }
  .main { padding: 12px; }
  .top .chip { display: none; }
}
</style>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="-20 -24 40 44" aria-hidden="true">
      <path d="M0 -20 L17 -11 L17 8 L0 17 L-17 8 L-17 -11 Z" fill="var(--rose)" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-17 -11 L0 -2 L17 -11 M0 -2 L0 17" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M-8 -18 L-11 -27 L-4 -20 M8 -18 L11 -27 L4 -20" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <span>Devil's <mark>Den</mark></span>
  </div>
  <span class="chip">game blueprint · v0.2</span>
  <div class="spacer"></div>
  <button class="iconbtn" id="theme" aria-label="Switch light or dark theme" title="Switch theme">
    <svg width="16" height="16" viewBox="0 0 24 24" class="ico" aria-hidden="true" style="stroke:var(--ink)"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
  </button>
</header>

<div class="app">
  <nav class="nav" aria-label="Blueprint parts">
    <h2>Blueprint <small id="partcount"></small></h2>
    <div id="parts" style="display:contents"></div>
    <div class="navnote">Planning document. Nothing here is final. Tick the decisions on the right as we settle them.</div>
  </nav>

  <main class="main">
    <div>
      <div class="crumbs" id="crumbs"></div>
      <div class="headrow">
        <div>
          <h1 id="title"></h1>
          <p id="summary"></p>
        </div>
        <div class="tags" id="tags"></div>
      </div>
    </div>
    <div class="stagewrap">
      <div class="stats" id="stats"></div>
      <svg class="stage" id="stage" viewBox="-480 -290 960 580" role="img" aria-label="Diagram for the current step"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <section class="stepper" aria-label="Steps in this part">
      <header>In this part <span id="stepof"></span></header>
      <div class="dots" id="dots"></div>
    </section>
  </main>

  <aside class="side">
    <section class="panel" aria-live="polite">
      <div class="stephead"><span id="stepno"></span><span class="tag" id="tag"></span></div>
      <h3 id="steptitle"></h3>
      <div class="body" id="stepbody"></div>
      <div class="navbtns">
        <button class="btn" id="back"><span aria-hidden="true">←</span> Back</button>
        <button class="btn primary" id="next"><span id="nextlabel">Next</span><span aria-hidden="true">→</span></button>
      </div>
      <div class="hint"><kbd>←</kbd> <kbd>→</kbd> step</div>
    </section>
    <section class="panel decide">
      <h4>DECISIONS FOR THIS PART</h4>
      <div id="decisions"></div>
    </section>
  </aside>
</div>

<script>
(() => {
/* ---------- palette for characters (game art, same in both themes) ---------- */
const SHIRTS = ['#e8604c','#4a90d9','#5cb85c','#f0c419','#9b6fd1','#ef8a3c','#2bb3a0','#f2efe9','#f27db0','#8d6e63','#8e99a6','#3fd0e0'];
const SKIN = ['#f6d7bb','#e9b994','#c98d63','#94603f','#5e3b27'];
const HAIRC = ['#3a2a20','#1f1c1a','#e1b659','#c4622d','#a39e95','#e58fb1'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shade(hex, amt) { // amt < 0 darkens toward black
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---------- drawing primitives ---------- */
function prism(x, y, a, h, hue, b = a / 2) {
  const top = `M${x} ${y-h-b} L${x+a} ${y-h} L${x} ${y-h+b} L${x-a} ${y-h} Z`;
  const left = `M${x-a} ${y-h} L${x} ${y-h+b} L${x} ${y+b} L${x-a} ${y} Z`;
  const right = `M${x+a} ${y-h} L${x} ${y-h+b} L${x} ${y+b} L${x+a} ${y} Z`;
  const out = `M${x} ${y-h-b} L${x+a} ${y-h} L${x+a} ${y} L${x} ${y+b} L${x-a} ${y} L${x-a} ${y-h} Z`;
  return `<g style="--h:var(--${hue})"><path class="f-left" d="${left}"/><path class="f-right" d="${right}"/><path class="f-top" d="${top}"/>
    <path class="seam" d="M${x-a} ${y-h} L${x} ${y-h+b} L${x+a} ${y-h} M${x} ${y-h+b} L${x} ${y+b}"/><path class="edge" d="${out}"/></g>`;
}
// prism from a rectangle footprint, projected with iso()
function boxRect(iso, r, h, hue) {
  const A = iso(r.x, r.y), B = iso(r.x + r.w, r.y), C = iso(r.x + r.w, r.y + r.h), D = iso(r.x, r.y + r.h);
  const up = p => [p[0], p[1] - h];
  const pts = a => a.map(p => p.join(' ')).join(' L');
  const top = `M${pts([up(A), up(B), up(C), up(D)])} Z`;
  const left = `M${pts([up(D), up(C), C, D])} Z`;
  const right = `M${pts([up(B), up(C), C, B])} Z`;
  return `<g style="--h:var(--${hue})"><path class="f-left" d="${left}"/><path class="f-right" d="${right}"/><path class="f-top" d="${top}"/>
    <path class="seam" d="M${pts([up(D), up(C), up(B)])} M${pts([up(C), C])}"/>
    <path class="edge" d="M${pts([up(A), up(B), B, C, D, up(D)])} Z"/></g>`;
}
function pill(x, y, text, o = {}) {
  const fs = o.fs || 13.5, w = text.length * fs * 0.6 + 26, h = fs + 15;
  const fill = o.tone ? `style="fill:var(--${o.tone})"` : '';
  return `<g><rect class="pdrop" x="${x - w/2 + 1.5}" y="${y - h/2 + 2.5}" width="${w}" height="${h}" rx="${h/2}"/>
    <rect class="pbody" ${fill} x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="${h/2}"/>
    <text class="ptext" x="${x}" y="${y + fs * 0.36}" font-size="${fs}">${esc(text)}</text></g>`;
}
const ICONS = {
  server: 'M-10 -9 h20 v7 h-20 Z M-10 2 h20 v7 h-20 Z M-6 -5.5 h.1 M-6 5.5 h.1',
  file: 'M-7 -10 h9 l5 5 v15 h-14 Z M2 -10 v5 h5',
  coin: 'M0 -10 a10 10 0 1 0 .1 0 Z M0 -5 v10 M-3 -2.5 h5 a2.5 2.5 0 0 1 0 5 h-5',
  eye: 'M-11 0 C-6 -8 6 -8 11 0 C6 8 -6 8 -11 0 Z M0 -3.5 a3.5 3.5 0 1 0 .1 0 Z',
  chat: 'M-10 -8 h20 v12 h-11 l-5 5 v-5 h-4 Z',

    { short: 'Turn it', tag: 'CONCEPT', title: 'Turn it to look around (try it)', remove: ['stack', 'timer'], add: ['spin'], hi: ['spin'],
      body: `<p>While looking, each player can turn the structure on their own screen:</p><ul><li><b>Drag sideways</b> to spin it.</li><li><b>Drag up or down</b> to tilt it a little.</li><li>Tap <b>⟲ 90°</b> or <b>90° ⟳</b> to snap a quarter turn.</li></ul><p>Everyone turns their own copy; it doesn’t move for anyone else. Try it on the diagram.</p>`,
      key: 'Turning replaces guessing with looking. Anyone who uses their 20 seconds well can see every column.' },
    { short: 'How it’s drawn', tag: 'TECHNIQUE', title: 'Drawing a structure that turns', add: ['spin3d'], hi: ['spin3d'],
      body: `<p>A fixed isometric picture is one camera angle. To turn it, every frame we rotate the heightmap around its middle, project each cube onto the screen with a bit of 3D math, and draw from far to near so near cubes cover far ones. Only faces that touch air are drawn.</p><p>Two ways to build it:</p><ul><li><b>Our own canvas drawing</b>, like this diagram: small, keeps the flat outlined look.</li><li><b>three.js</b>: real 3D with lighting, zoom and perspective, but heavier and harder to keep this style.</li></ul><p>Recommendation: our own drawing first; switch to three.js only if we want zoom or perspective.</p>`,
      key: 'The heightmap never changes. Only the camera turns.' },
    { short: 'Layers', tag: 'CONCEPT', title: 'Count by layers', remove: ['spin', 'spin3d', 'ask'], add: ['layers', 'rule'], hi: ['layers'],
      body: `<p>Taken apart, the example is three layers: 13 + 6 + 1 = <b>20</b> cubes. Most people answer around 16, because the bottom layer is hidden under the others.</p><p>One rule, shown to players, makes it solvable: <b>no floating cubes</b>. Every cube sits on the floor or on another cube.</p>`,
      key: 'Thinking in layers is the skill the game rewards. The reveal teaches it.' },
    { short: 'Generator', tag: 'TECHNIQUE', title: 'How the server builds a structure', remove: ['layers', 'rule'], add: ['stack', 'tiles', 'a_build', 'gen'], hi: ['tiles'],
      body: `<p>A structure is stored as a <b>heightmap</b>: a small grid with one number per column. A 3 means three cubes stacked there. The total is the sum of the numbers.</p><p>The server makes random heights, taller toward the middle so that turning it matters, and keeps it if the count is in range for the difficulty.</p>`,
      key: 'A grid of numbers is easy to make, check, send and score.' },
    { short: 'Difficulty', tag: 'DECISION', title: 'Three difficulty levels', remove: ['stack', 'tiles', 'a_build', 'gen'], add: ['diffs'], hi: ['diffs'],
      body: `<ul><li><b>Easy:</b> 3×3 base, up to 3 high, 7–12 cubes, 25 s to look, free turning.</li><li><b>Medium:</b> 4×4 base, up to 4 high, 15–30 cubes, 20 s, free turning.</li><li><b>Hard:</b> 6×6 base, up to 5 high, 40–80 cubes, 15 s, 90° snaps only.</li></ul><p>Bigger structures, less time, and less freedom to turn.</p>`,
      key: 'Difficulty = size + time + turning. All three are numbers in one settings table.' },
    { short: 'Answer', tag: 'CONCEPT', title: 'Answering on your phone', remove: ['diffs'], add: ['stack', 'phone'], hi: ['phone'],
      body: `<p>When looking time ends, the structure hides and a number pad appears. Type a number and tap ✓ to lock it in.</p><p>Once locked, it can’t change. Players who don’t answer in 15 seconds score 0 for the round.</p>`,
      key: 'Hide the structure while answering, so the look phase really is memory.' },
    { short: 'Reveal', tag: 'TECHNIQUE', title: 'Reveal and scoring', remove: ['stack', 'phone'], add: ['numline'], hi: ['numline'],
      body: `<p>The structure comes back, layer by layer, counting up. Then everyone’s answers appear on a number line.</p><ul><li><b>Exact:</b> 3 points</li><li><b>Within 5%:</b> 2 points</li><li><b>Within 10%:</b> 1 point</li></ul><p>Percentages scale fairly: at Hard, with 40 cubes, 2 off still earns 2 points.</p>`,
      key: 'Close answers earn something, so nobody is out after one bad round.' },
    { short: 'Server', tag: 'TECHNIQUE', title: 'What the server sends', remove: ['numline'], add: ['stack', 'net'], hi: ['net'],
      body: `<p>To draw the structure from any angle, each screen needs every cube on the outside of it. The count is never sent, and answers are checked on the server.</p><p>At the reveal the server sends the full heightmap and the answer.</p><p>Someone who digs through the browser’s data could still work the count out, just as someone could screenshot Memory Poker. For friends, the same house rule covers both.</p>`,
      key: 'Turning means the shape has to be in the browser. Keep the answer out of it.' },
    { short: 'How much', tag: 'DECISION', title: 'How much turning?', remove: ['stack', 'net'], add: ['fair'], hi: ['fair'],
      body: `<p>From one fixed view, a column can hide behind taller ones. Once players can turn the structure, every column shows up from some side, so every puzzle is <b>fair</b>: the only pressure is time.</p><p>Options:</p><ul><li><b>Free turning:</b> smooth, the most natural feel.</li><li><b>90° snaps:</b> four fixed views. Simpler, and you have to choose where to look.</li><li><b>Limited turns:</b> for example 2 quarter-turns per round.</li></ul><p>Tilt stays between about 20° and 55°. A straight top-down view would make counting columns too easy.</p><p>Recommendation: free turning at Easy and Medium, snaps only at Hard.</p>`,
      key: 'Turning sets how much is skill and how much is time pressure.' },
    { short: 'Recap', tag: 'RECAP', title: 'Recap', remove: ['fair'], add: ['stack', 'ask'],
      body: `<ul><li>Round: look and turn 20 s → answer 15 s → reveal 15 s.</li><li>Each player turns their own view: drag, tilt or 90° snaps.</li><li>Structures are heightmaps made on the server.</li><li>Difficulty sets size, looking time and how freely you can turn.</li><li>Scoring: exact 3, within 5% 2, within 10% 1.</li><li>The answer never reaches a browser before the reveal.</li></ul>`,
      key: 'Simple to play, satisfying to get exactly right.' },
  ],
},

  summary: 'Memorize 12 face-up cards by letter, then pick two letters to build the best poker hand with three shared cards.',
  stats: [['Cards', '12 (3 × 4)'], ['Memorize', '20 s'], ['Main deck', '3 cards'], ['You pick', '2 letters']],
  legend: [],
  decisions: ['Can two players pick the same card, or does the first lock win it?', 'Points by placing (3/2/1), or by hand strength?', 'Show everyone’s picks at showdown, or only the winner’s?'],

    gridDown: { type: 'custom', draw: () => LETTERS.map((L, i) => card(...gpos(i), null, { letter: L })).join('') },

    showdown: { type: 'custom', draw: () => [
      [-150, SHIRTS[2], 'bob', 3, 1, 'A + F', ['K♠', 'K♥'], 'Three Kings → 3 pts', 'green'],

    diffs: { type: 'custom', draw: () => [[-280, 'green', 'Easy', '30 s look', '25 s to pick'], [0, 'yellow', 'Medium', '20 s look', '20 s to pick'], [280, 'rose', 'Hard', '12 s look', '15 s to pick']]
      .map(([x, hue, l, sub, p]) => render({ type: 'block', x, y: 60, a: 66, h: 48, hue, label: l, sub, icon: 'cards' }) + pill(x, 130, p, { fs: 12 })).join('') +
      pill(0, -150, 'same 3 × 4 grid and 3-card main deck at every level', { fs: 12, tone: 'violet' }) },
    server: { type: 'custom', draw: () => render({ type: 'block', x: -270, y: 20, a: 70, h: 52, hue: 'blue', label: 'Server', sub: 'dealer + judge', icon: 'server' }) +
      [['shuffles with a secure random source', -170, 'blue'], ['sends card faces only during the 20 s', -115, 'yellow'], ['keeps picks hidden until showdown', -60, 'violet'], ['ranks every hand, splits ties', -5, 'green'], ['a screenshot can still cheat → house rule', 85, 'rose']]
        .map(([t, y, tone]) => `<path class="lead" d="M-190 ${Math.max(-60, Math.min(20, y))} L-10 ${y}"/>` + pill(150, y, t, { fs: 12, tone })).join('') },
  },
  steps: [
    { short: 'Deal', tag: 'CONCEPT', title: '12 cards, face up, 20 seconds', add: ['gridUp', 'timer'], hi: ['gridUp'],
      body: `<p>The server deals 12 cards from a normal deck into a 3 × 4 grid. Each position has a letter, <b>A</b> to <b>L</b>.</p><p>Everyone sees the same grid for 20 seconds and tries to remember which card is under which letter.</p>`,
      key: 'You’re memorizing positions, not just cards: “the Kings were A and F.”' },
    { short: 'Flip', tag: 'CONCEPT', title: 'The cards turn face down', remove: ['gridUp', 'timer'], add: ['gridDown', 'flipped'], hi: ['gridDown'],
      body: `<p>When the timer ends, every card flips. Only the letters stay visible.</p><p>From here on it’s memory only. Nobody is told what they’re looking for yet.</p>`,
      key: 'You memorize before you know which cards will matter. That’s the tension.' },
    { short: 'Main deck', tag: 'CONCEPT', title: 'Three main-deck cards are revealed', add: ['deck'], hi: ['deck'],
      body: `<p>Three cards from the rest of the deck are turned up for everyone. They are shared and are part of every player’s hand.</p><p>Here: <b>K♦ 7♥ 2♠</b>. Now you know what to hunt for: another two Kings would be great.</p>`,
      key: 'The main deck turns memory into a decision.' },
    { short: 'Pick', tag: 'CONCEPT', title: 'Pick two letters on your phone', add: ['phone', 'pickHi'], hi: ['phone', 'pickHi'],
      body: `<p>Each player privately picks two letters, say <b>A + F</b>, and locks them in within 20 seconds.</p><p>Your hand is your 2 picked cards plus the 3 main-deck cards: a normal 5-card poker hand.</p>`,
      key: 'Your picks stay secret until the showdown, so nobody can copy them.' },
    { short: 'Showdown', tag: 'CONCEPT', title: 'Showdown', remove: ['gridDown', 'flipped', 'deck', 'phone', 'pickHi'], add: ['showdown'], hi: ['showdown'],
      body: `<p>Everyone’s picks flip over and the server ranks the hands with normal poker rules:</p><ul><li>Mina picked A + F: K♠ K♥ → <b>three Kings</b>.</li><li>Jae picked B + L: 7♦ 7♣ → three Sevens.</li><li>Sol picked D + F, thinking D was a King. It was Q♥ → pair of Kings.</li></ul>`,
      key: 'A memory mistake just becomes a weaker hand, which is funny and fair.' },
    { short: 'Scoring', tag: 'DECISION', title: 'Points for the best hands', add: ['scoring'], hi: ['scoring'],
      body: `<p>Points by placing: best hand <b>3</b>, second <b>2</b>, third <b>1</b>. Equal hands share the placing.</p><p>Both players may pick the same card in this version, since picks are private. A spicier variant: the <b>first to lock in</b> a card gets it, so speed and bluffing matter.</p>`,
      key: 'Placing points keep every round worth the same.' },
    { short: 'Difficulty', tag: 'DECISION', title: 'Three difficulty levels', remove: ['showdown', 'scoring'], add: ['diffs'], hi: ['diffs'],
      body: `<ul><li><b>Easy:</b> 30 s to memorize, 25 s to pick.</li><li><b>Medium:</b> 20 s and 20 s (your spec).</li><li><b>Hard:</b> 12 s and 15 s.</li></ul><p>The grid stays 3 × 4 at every level, so the rules never change; only the clock does.</p>`,
      key: 'Same game, tighter clock.' },
    { short: 'Server', tag: 'TECHNIQUE', title: 'The server is dealer and judge', remove: ['diffs'], add: ['server'], hi: ['server'],
      body: `<p>The server shuffles, deals, times every phase and ranks hands with a small hand evaluator, which needs good tests.</p><p>Card faces are only sent during the memorize window. Remote players could still take a screenshot, and no website can stop that. For friends, a house rule (“no screenshots”) is enough.</p>`,
      key: 'Protect what software can protect, and use a house rule for the rest.' },
    { short: 'Recap', tag: 'RECAP', title: 'Recap', remove: ['server'], add: ['gridDown', 'deck'],
      body: `<ul><li>Round: memorize 20 s → main deck → pick 20 s → showdown.</li><li>Hand = your 2 letters + 3 main-deck cards.</li><li>Best hand 3, second 2, third 1. Ties share.</li><li>Difficulty only changes the timers.</li><li>The server deals, hides picks and judges.</li></ul>`,
      key: 'Memory, then poker. Two skills in one minute.' },
  ],
},

  steps: [
    { short: 'One link', tag: 'CONCEPT', title: 'Everyone opens one link', add: ['you', 'friend', 'server'],
      body: `<p>Players open a web page. It connects to one game server over a <b>WebSocket</b>, a connection that stays open in both directions for the whole match.</p><p>Nobody installs anything, so it works the same on a laptop or a phone.</p>`,
      key: 'The server is the referee. Each browser is a screen and a controller, nothing more.' },
    { short: 'Press a key', tag: 'TECHNIQUE', title: 'You press a key', add: ['a_in'], hi: ['a_in'],
      body: `<p>Your browser does <b>not</b> move your character. It tells the server what you want: <code>"holding left"</code>.</p><p>The message is a few bytes and is sent only when your keys change.</p>`,
      key: 'Send intent, not results. The server decides if you can actually move there.' },
    { short: 'Simulate', tag: 'TECHNIQUE', title: 'The server runs the game', add: ['tick'], hi: ['server', 'tick'],
      body: `<p>Twenty times a second the server moves everyone, stops them at walls, ticks timers, and checks kills, tasks and wins.</p><p>There is exactly one copy of the truth, so two players can never disagree about what happened.</p>`,
      key: 'One authority means no arguments and no desync.' },
    { short: 'Your view', tag: 'CONCEPT', title: 'Everyone gets their own picture', add: ['a_out_you', 'a_out_fr'], hi: ['a_out_you', 'a_out_fr'],
      body: `<p>After each tick the server builds a <b>separate</b> update for each player. Yours holds only the people near you, your own role and your own tasks.</p><p>Your friend gets a different update with different secrets in it.</p>`,
      key: 'Filtering is the anti-cheat. You can’t read a secret that was never sent to you.' },
    { short: 'Shared rules', tag: 'TECHNIQUE', title: 'One rulebook, two readers', add: ['shared', 'a_sh_srv', 'a_sh_you'], hi: ['shared'],
      body: `<p>The map shape and the numbers (speed, kill range, cooldowns) live in one file, <code>map.js</code>, that both server and browser load.</p><p>Change a number once and both sides agree. What you see always matches where the walls really are.</p>`,
      key: 'Shared code prevents a whole class of “but it looked like I could walk there” bugs.' },
    { short: 'Why a server', tag: 'PROBLEM', title: 'Why not let browsers talk directly?', add: ['bad'], hi: ['bad'],
      body: `<p>Peer-to-peer sounds cheaper, but someone has to know who the Devil is. If every browser holds the full game, anyone can open developer tools and read the roles.</p><p>In a game built on lying, that ends the game.</p>`,
      key: 'Hidden-role games need a trusted middle. That is the server.' },
    { short: 'Hosting', tag: 'DECISION', title: 'Hosting and voice for remote play', add: ['host', 'voice'], remove: ['bad'], hi: ['host', 'voice'],
      body: `<p>One small Node server is enough for a friend group. Render, Railway and Fly.io all run it for free or a few dollars a month.</p><p>For talking, a Discord call next to the game is simpler and better than building voice in.</p><p>For quick tests, a tunnel such as <code>cloudflared</code> can share a laptop’s server.</p>`,

    { short: 'Recap', tag: 'RECAP', title: 'Recap', hi: ['server'],
      body: `<ul><li>Browsers send <b>intent</b> (keys, clicks, votes).</li><li>The server <b>simulates</b> 20× a second and owns the truth.</li><li>Each player receives a <b>filtered</b> view.</li><li>Map and rules are <b>shared</b> code.</li></ul>`,
      key: 'Thin clients, smart server, filtered views.' },
  ],
},

    result: { type: 'block', x: 120, y: 175, a: 56, h: 40, hue: 'yellow', label: 'Result', icon: 'vote' },
    over: { type: 'block', x: -170, y: 150, a: 58, h: 42, hue: 'rose', label: 'Game over', icon: 'trophy', fs: 14 },
  },
  steps: [
    { short: 'Lobby', tag: 'CONCEPT', title: 'Lobby: gather and get dressed', add: ['lobby'], hi: ['lobby'],
      body: `<p>Players join with a name and pick their look (hair, hair color, skin). The first person in is the <b>host</b> and presses Start.</p><p>Minimum 3 players to test, 5 or more to be fun.</p>`,
      key: 'The lobby also shows everyone’s pieces from earlier matches.' },
    { short: 'Roles', tag: 'CONCEPT', title: 'Secret roles are dealt', add: ['reveal', 'a1'], hi: ['reveal'],
      body: `<p>The server shuffles players and picks the Devils: 1 Devil below 7 players, 2 from 7 up. Each player sees a 3-second splash with their own role only.</p><p>Devils also learn who the other Devils are.</p>`,
      key: 'Roles are dealt on the server and sent privately, one player at a time.' },
    { short: 'Play', tag: 'CONCEPT', title: 'Play: tasks, hunting, suspicion', add: ['play', 'a2'], hi: ['play'],
      body: `<ul><li>Everyone walks around with limited vision.</li><li>Players do tasks (+1 piece each).</li><li>Devils fake tasks and can eliminate someone in range every 25 s.</li><li>Anyone can report a body or press the emergency button (once each).</li></ul><p>No public chat during play, but private whispers are allowed.</p>`,
      key: 'Silence in play, talking in meetings. That rhythm makes the game.' },
    { short: 'Meeting', tag: 'CONCEPT', title: 'Meeting: argue, then vote', add: ['meeting', 'a3'], hi: ['meeting'],
      body: `<p>Everyone freezes. For 90 seconds the living chat and each casts one vote: a player or <b>skip</b>. Spending 2 pieces makes your vote count double.</p><p>The meeting ends early when every living player has voted.</p>`,
      key: 'Votes are final once cast, so timing your vote is a strategy.' },
    { short: 'Result', tag: 'DECISION', title: 'Result: who goes?', add: ['result', 'a4', 'a5'], hi: ['result'],
      body: `<p>The most-voted player is ejected. A tie or a skip ejects nobody. The screen shows the vote counts for 6 seconds, then play resumes with everyone back at spawn.</p><p><b>Decision:</b> do we say whether they were a Devil? Showing it is fairer. Hiding it creates more paranoia, which suits Devil’s Plan.</p>`,
      key: 'This single rule changes how the whole game feels.' },
    { short: 'Win check', tag: 'TECHNIQUE', title: 'Checking for a winner', add: ['over', 'a6', 'a7'], hi: ['over'],
      body: `<p>The server checks for a winner after every kill, finished task, ejection and disconnect:</p><ul><li><b>Players win</b> if every Devil is out or all tasks are done.</li><li><b>Devils win</b> once they equal or outnumber everyone else.</li></ul>`,
      key: 'Check the win in one function and call it after anything that changes who is alive.' },
    { short: 'Again', tag: 'CONCEPT', title: 'Back to the lobby, pieces kept', add: ['a8'], hi: ['lobby'],
      body: `<p>The winning side gets +3 pieces each. The host sends everyone back to the lobby. Pieces carry over, so a game night becomes a <b>series</b>.</p>`,
      key: 'The match ends, but the score keeps running. That’s the Devil’s Plan layer.' },
    { short: 'Recap', tag: 'RECAP', title: 'Recap', hi: ['play', 'meeting'],
      body: `<p>Every incoming message is checked against the phase first: no moving in meetings, no voting in play, no killing in the lobby.</p><p>Six phases, one loop. Most bugs in games like this come from an action being allowed in the wrong phase.</p>`,
      key: 'The phase is the first rule.' },
  ],
},

  els: {

    meet: { type: 'pill', x: 0, y: -230, text: 'meeting: everyone listed, no positions needed', fs: 12, tone: 'orange' },
    los: { type: 'pill', x: 0, y: -230, text: 'v2 idea: walls cast shadows', fs: 12, tone: 'yellow' },
  },
  steps: [
    { short: 'Full truth', tag: 'CONCEPT', title: 'The server sees the whole board', add: ['floor', 'd', 'dv', 'gh', 'you', 'b', 'c', 'server', 't_srv'], hi: ['server'],
      body: `<p>On the server, every position, role, body and timer is known. That full picture is never sent to anyone as it is.</p>`,
      key: 'Think of the server as the show’s control room. Players are on the floor.' },
    { short: 'Your view', tag: 'TECHNIQUE', title: 'What a player receives', add: ['vis_you', 't_you'], dim: ['d', 'dv', 'c', 'gh'], hi: ['vis_you'],
      body: `<p>Your update contains only living players inside your vision radius (about 260 px). Everyone else is simply left out of the message.</p><p>Ghosts are never sent to living players, so you can’t tell who is dead until a body is found.</p>`,
      key: 'Your browser draws fog, but the fog isn’t the protection. The missing data is.' },
    { short: 'Devil view', tag: 'TECHNIQUE', title: 'What a Devil receives', add: ['vis_dv', 't_dv'], remove: ['vis_you', 't_you'], dim: ['you', 'b', 'd', 'gh'], hi: ['vis_dv'],
      body: `<p>Devils see a bit further (about 340 px), see fellow Devils marked in red, and get a kill-cooldown timer.</p><p>Their Kill button lights up only when a target is in range, and the server checks the range again when it arrives.</p>`,
      key: 'Never trust the button. The server re-checks every action.' },
    { short: 'Ghost view', tag: 'CONCEPT', title: 'Ghosts see everything', add: ['t_gh'], remove: ['vis_dv', 't_dv'], hi: ['gh'],
      body: `<p>Eliminated players become ghosts. They float through walls, see the whole map, and can still finish tasks to help their team.</p><p>They can’t vote or talk to the living. Ghost chat only reaches other ghosts.</p>`,
      key: 'Ghosts stay in the game, so dying early isn’t boring.' },
    { short: 'Meetings', tag: 'CONCEPT', title: 'Meetings show everyone', add: ['meet'], remove: ['t_gh'], hi: ['meet'],
      body: `<p>During a meeting every player is listed, alive or dead, so people can vote. Positions don’t matter here, because everyone teleports back to spawn afterwards.</p>`,
      key: 'What’s secret depends on the phase.' },
    { short: 'Walls', tag: 'TRADE-OFF', title: 'Upgrade: walls block sight', add: ['los'], remove: ['meet'], hi: ['los'],
      body: `<p>A radius is simple, but walls that block vision make corners and doorways matter: you can hide, ambush and lose sight of people.</p><p><b>Cost:</b> the server works out a visibility shape for each player each tick, and the browser draws shadows. That’s cheap on a small map but takes a few days to build well.</p>`,
      key: 'Version 1 uses a radius. Line of sight is a strong second milestone.' },
    { short: 'Recap', tag: 'RECAP', title: 'Recap',
      body: `<ul><li>The server holds the full truth.</li><li>Each player is sent only what their character can see.</li><li>Roles change the view: players, Devils, ghosts.</li><li>Every action is re-checked on the server.</li></ul>`,
      key: 'Design for the player who opens developer tools.' },
  ],
},
{
  id: 'map', title: 'The Map', folder: 'orange', mins: '6 min', level: 'World',
  summary: 'Seven rooms joined by corridors, twelve task stations, one emergency button.',
  stats: [['World', '1600 × 1100'], ['Rooms', '7'], ['Task stations', '12'], ['Walk speed', '180 px/s']],
  legend: [['#f6df97', 'task station'], ['#f6cad0', 'emergency button']],
  decisions: ['Flat top-down look, or isometric like this page?', 'Draw rooms in code, or in the Tiled editor?', 'Room theme: casino and vault, or something else?'],
  els: { ...mapEls },
  steps: [
    { short: 'Rooms', tag: 'CONCEPT', title: 'Seven rooms', add: ['rooms', 'labels'],
      body: `<p>The Cafeteria (top middle) is home base. The Vault and Lab sit on top, the Casino, Library and Engine Room at the bottom, and the Great Hall runs through the middle.</p>`,
      key: 'Name rooms after things. “I saw them in the Vault” is easier to say than “top left”.' },
    { short: 'Corridors', tag: 'TECHNIQUE', title: 'Corridors and walls', add: ['corridors'], hi: ['corridors'],
      body: `<p>The map is a list of rectangles. You can stand anywhere inside one. Collision checks the four corners of your character: if any corner leaves every rectangle, you stop.</p><p>Movement is checked one axis at a time, so you slide along walls instead of sticking.</p>`,
      key: 'Simple geometry, so every rule is easy to check on the server.' },
    { short: 'Tasks', tag: 'CONCEPT', title: 'Task stations', add: ['tasks'], hi: ['tasks'],
      body: `<p>Twelve stations are spread across every room. Each player gets 4 at random, so routes differ and people split up.</p><p>Two kinds for now: <b>hold</b> (hold a button for 3 s) and <b>sequence</b> (tap numbers in order). Devils get fake tasks so they can blend in.</p>`,
      key: 'Tasks exist to spread people out, and spread-out people are vulnerable.' },
    { short: 'Button', tag: 'CONCEPT', title: 'Spawn and the emergency button', add: ['button', 'spawn'], hi: ['button'],
      body: `<p>Everyone starts around the Cafeteria table, where the emergency button is. Each living player can press it once per match to call a meeting.</p>`,
      key: 'Putting the button at spawn makes the Cafeteria a social hub.' },
    { short: 'Flow', tag: 'TRADE-OFF', title: 'Dead ends are dangerous', add: ['deadend'], hi: ['hall'],
      body: `<p>The Vault and Lab each have one way in (plus a side door to the Cafeteria). Rooms with a single exit are where Devils hunt.</p><p>That’s fine, but we should playtest it. Adding vents or shortcuts for Devils is a common next step.</p>`,
      key: 'Map shape is game balance. Expect to adjust it after the first playtest.' },
    { short: 'Editor', tag: 'DECISION', title: 'Rectangles in code, or a map editor?', remove: ['deadend'],
      body: `<p><b>Rectangles in code</b> (now): fast to start and easy to read, but redesigning is fiddly.</p><p><b>Tiled editor</b>: draw rooms visually, add furniture and art layers, export JSON. Worth switching once we want real art.</p>`,
      key: 'Start in code and move to Tiled when the layout settles.' },
    { short: 'Look', tag: 'DECISION', title: 'Flat or isometric?', hi: ['rooms'],
      body: `<p>Game logic stays flat 2D either way. <b>Isometric</b> only changes how we draw it, using the same projection as this page.</p><p>Isometric looks great and matches this style. The extra work is drawing order (things behind walls) and taller art.</p>`,
      key: 'Logic in 2D, looks in 2.5D. The two are separate decisions.' },
  ],
},

  steps: [
    { short: 'Silhouette', tag: 'CONCEPT', title: 'A chunky little human', add: ['heroSlab', 'hero', 'n1', 'l1', 'n2', 'l2', 'n3', 'l3', 'n4', 'l4'],
      body: `<p>Big round head, a soft boxy body, short legs, small arms. The proportions are toy-like, so a character still reads clearly at about 48 px tall on a phone.</p><p>The thick dark outline matches the diagram style and keeps characters visible on any floor.</p>`,
      key: 'Readable at a glance beats detailed. You need to recognize people in half a second.' },
    { short: 'Hair', tag: 'CONCEPT', title: 'Hair is identity', remove: ['heroSlab', 'hero', 'n1', 'l1', 'n2', 'l2', 'n3', 'l3', 'n4', 'l4'], add: ['hairRow'],
      body: `<p>With no facial features, the <b>hair shape</b> is how you tell people apart at a distance. Six shapes, each with a clearly different outline: crop, bob, bun, spiky, long, afro.</p>`,
      key: 'Test each shape as a solid black silhouette. If two look alike, change one.' },
    { short: 'Color', tag: 'TECHNIQUE', title: 'Shirt color is the player, skin is yours', remove: ['hairRow'], add: ['colorRow'],
      body: `<p>Each player gets one of 12 shirt colors, which is also their name color in chat and on the vote screen. “Orange was in the Lab” has to mean exactly one person.</p><p>Skin tone and hair color are personal choices and don’t identify the player.</p>`,
      key: 'One color = one player, everywhere in the interface.' },
    { short: 'No face', tag: 'CONCEPT', title: 'Why the face is blank', remove: ['colorRow'], add: ['heroSlab', 'hero', 'faceNote'], hi: ['hero'],
      body: `<p>It’s a lying game. A drawn face would either show emotion that gives something away or look oddly calm all the time. A blank face lets players project onto it, and it’s cheap to draw.</p><p>It also keeps us clear of any one game’s look: these are people, not suits.</p>`,
      key: 'The tells should come from behavior, not the art.' },
    { short: 'States', tag: 'TECHNIQUE', title: 'Four states to draw', remove: ['heroSlab', 'hero', 'faceNote'], add: ['states'],
      body: `<ul><li><b>Walking:</b> a gentle bob and alternating legs (4 frames).</li><li><b>Ghost:</b> see-through, floating, no legs.</li><li><b>Eliminated:</b> lying flat, desaturated.</li><li><b>Devil:</b> small horns and a red glow, shown only on the end screen.</li></ul>`,
      key: 'Devils look exactly like everyone else until the game is over.' },
    { short: 'Layers', tag: 'TECHNIQUE', title: 'Built from layers, not drawn by hand', remove: ['states'], add: ['layers'],
      body: `<p>Each character is stacked from parts: legs, body and arms, head, hair. Each part is tinted with a color. Nobody draws 2,160 sprites; the game combines them.</p><p>That is exactly how the characters on this page are drawn, so this code can go straight into the game.</p>`,

      body: `<p>Winning a match isn’t everything. Each player also has a pile of <b>pieces</b> that grows and shrinks with what they do.</p><p>It gives every player, on either side, a personal reason to take risks.</p>`,

/* ---------- app ---------- */
const $ = id => document.getElementById(id);
let part = 0, step = 0;
const stage = $('stage');
const DEFS = `<defs>
  <pattern id="iso" width="48" height="24" patternUnits="userSpaceOnUse"><path d="M0 12 L24 0 L48 12 L24 24 Z" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink)"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--red)"/></marker>
</defs><rect x="-480" y="-290" width="960" height="580" fill="url(#iso)"/>`;

function visibleAt(p, i) {
  const vis = new Set();
  for (let k = 0; k <= i; k++) { (p.steps[k].remove || []).forEach(id => vis.delete(id)); (p.steps[k].add || []).forEach(id => vis.add(id)); }
  return vis;
}
PARTS.forEach(p => { p.phase = p.phase || 2; });
const num = p => `${p.phase}.${PARTS.filter(q => q.phase === p.phase).indexOf(p) + 1}`;
function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null'); localStorage.setItem(key, JSON.stringify(val)); } catch { return null; } }

let unmount = null;
function drawStage(animate) {
  if (unmount) { unmount(); unmount = null; }
  const p = PARTS[part], s = p.steps[step], vis = visibleAt(p, step);
  const added = new Set(animate ? (s.add || []) : []), hi = new Set(s.hi || []), dim = new Set(s.dim || []);
  let html = DEFS;
  for (const [id, e] of Object.entries(p.els)) {
    if (!vis.has(id)) continue;
    const cls = ['el', added.has(id) ? 'enter' : '', hi.has(id) ? 'hi' : '', dim.has(id) ? 'dim' : ''].join(' ');
    html += `<g class="${cls}">${render(e)}</g>`;
  }
  stage.innerHTML = html;
  for (const [id, e] of Object.entries(p.els)) if (vis.has(id) && e.mount) unmount = e.mount(stage);
}

function renderAll(animate = true) {
  const p = PARTS[part], s = p.steps[step], n = p.steps.length;
  document.title = `${p.title} · Devil's Den Blueprint`;
  let lastPhase = 0;
  $('parts').innerHTML = PARTS.map((q, i) => {
    const hdr = q.phase !== lastPhase ? `<div class="phasehdr">${esc(PHASES[q.phase])}</div>` : '';
    lastPhase = q.phase;
    return hdr + `<button class="part" data-i="${i}" aria-current="${i === part}"><span class="folder" style="background:var(--${q.folder})"></span>${num(q)} ${esc(q.title)}<span class="n">${q.steps.length}</span></button>`;
  }).join('');
  $('partcount').textContent = `${PARTS.length} parts`;
  $('crumbs').textContent = `${PHASES[p.phase]}  /  ${num(p)} ${p.level}`;
  $('title').textContent = p.title;
  $('summary').textContent = p.summary;
  $('tags').innerHTML = `<span class="chip">${p.mins}</span><span class="chip">${p.level}</span><span class="chip">${n} steps</span>`;
  $('stats').innerHTML = p.stats.map(([k, v]) => `<div class="stat"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  $('legend').innerHTML = p.legend.map(([c, t]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join('');
  $('legend').hidden = !p.legend.length;
  $('dots').innerHTML = p.steps.map((q, i) => `<button class="dot ${i < step ? 'done' : ''} ${i === step ? 'cur' : ''}" data-i="${i}" aria-label="Step ${i + 1}: ${esc(q.short)}"><b>${i + 1}</b>${esc(q.short)}</button>`).join('');
  $('stepof').textContent = `Step ${step + 1} of ${n}`;
  $('stepno').textContent = `STEP ${step + 1} / ${n}`;
  $('tag').textContent = s.tag; $('tag').className = 'tag ' + s.tag;
  $('steptitle').textContent = s.title;
  $('stepbody').innerHTML = s.body + `<div class="key"><span class="ki" aria-hidden="true">!</span><div><small>KEY IDEA</small>${esc(s.key)}</div></div>`;
  $('back').disabled = part === 0 && step === 0;
  const last = step === n - 1;
  $('nextlabel').textContent = last ? (part < PARTS.length - 1 ? `Next part: ${PARTS[part + 1].title}` : 'Back to start') : `Next: ${p.steps[step + 1].short}`;
  const saved = store('dd-decisions') || {};
  $('decisions').innerHTML = p.decisions.map((d, i) => { const id = `dec-${p.id}-${i}`; return `<label for="${id}"><input type="checkbox" id="${id}" ${saved[id] ? 'checked' : ''}> ${esc(d)}</label>`; }).join('');
  drawStage(animate);
}

function go(pi, si, animate = true) {
  part = (pi + PARTS.length) % PARTS.length; step = si;
  if (location.hash.slice(1) !== PARTS[part].id) history.replaceState(null, '', '#' + PARTS[part].id);
  renderAll(animate);
}
function next() { const n = PARTS[part].steps.length; step < n - 1 ? go(part, step + 1) : go(part + 1, 0); }
function back() { if (step > 0) go(part, step - 1); else if (part > 0) go(part - 1, PARTS[part - 1].steps.length - 1); }

$('next').onclick = next; $('back').onclick = back;
$('parts').onclick = e => { const b = e.target.closest('.part'); if (b) go(+b.dataset.i, 0); };
$('dots').onclick = e => { const b = e.target.closest('.dot'); if (b) go(part, +b.dataset.i); };
$('decisions').onchange = e => { const saved = store('dd-decisions') || {}; saved[e.target.id] = e.target.checked; store('dd-decisions', saved); };
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
});
$('theme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
};
function fromHash() { const i = PARTS.findIndex(p => p.id === location.hash.slice(1)); go(i < 0 ? 0 : i, 0, false); }
addEventListener('hashchange', fromHash);
fromHash();
})();
</script>
